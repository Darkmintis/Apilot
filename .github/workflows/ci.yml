name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter "./packages/*" --filter "!apilot" --filter "!apilot-webview" build

      - name: Build webview + extension bundle
        run: |
          pnpm --filter apilot-webview build
          pnpm --filter apilot compile

      - name: Unit tests
        run: |
          pnpm --filter @apilot/core exec vitest run
          pnpm --filter @apilot/codegen exec vitest run

      - name: MCP server (source build and the bundle the extension ships)
        run: |
          node scripts/verify-mcp.js
          node scripts/verify-mcp.js packages/extension/dist/mcp.mjs

      - name: Extension integration tests (real VS Code)
        run: xvfb-run -a pnpm --filter apilot test

      - name: apilot check against the sample project
        working-directory: packages/mcp/test-project
        env:
          APILOT_SECRET_authToken: ci-test-token
        run: node ../../cli/dist/index.js check --env dev --markdown "$GITHUB_STEP_SUMMARY"

      - name: Package extension
        run: pnpm --filter apilot exec vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: apilot-vsix
          path: packages/extension/*.vsix

  dart-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dart-lang/setup-dart@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter @apilot/codegen... build
      - name: Generated Dart compiles, passes analyze, and round-trips JSON
        run: node scripts/verify-dart-codegen.mjs
